name: Update OSS Contributions

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC, an hour after the profile summary
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_USER: ${{ github.repository_owner }}
        run: ./scripts/render.sh

      # A rendering bug that emptied the file would otherwise be committed
      # silently, so fail loudly instead.
      - name: Sanity-check output
        run: |
          set -euo pipefail
          test -s README.md
          grep -q '^## repositories' README.md
          test "$(wc -l < README.md)" -ge 20

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update OSS contributions"
          git push

# touch to trigger workflow registration
